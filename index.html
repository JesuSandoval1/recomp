<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Recomp</title>
<style>
:root{
  color-scheme:dark;
  --bg:#111214;--card:#1b1c1f;--card2:#232428;--line:#2c2d31;
  --text:#f0efec;--text2:#c3c2b7;--muted:#8b8a83;
  --accent:#3987e5;--s2:#d95926;--raw:#6d6c67;
  --good:#0ca30c;--warn:#c98500;--bad:#e66767;
}
@media (prefers-color-scheme:light){:root{
  color-scheme:light;
  --bg:#f2f2f0;--card:#fcfcfb;--card2:#f0efec;--line:#e2e1dc;
  --text:#0b0b0b;--text2:#52514e;--muted:#7d7b75;
  --accent:#2a78d6;--s2:#eb6834;--raw:#b3b1aa;
  --good:#008300;--warn:#a86f00;--bad:#c93a39;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 16px 8px;display:flex;align-items:baseline;justify-content:space-between}
header h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em}
header span{color:var(--muted);font-size:13px}
main{padding:4px 12px calc(84px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:8px 0 10px;font:600 11px system-ui;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
.card{background:var(--card);border-radius:16px;padding:14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:650}
.card h3{font-size:13px;margin:12px 0 6px;color:var(--text2);font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:16px;padding:12px 12px 10px;min-height:96px}
.tile.wide{grid-column:span 2}
.tile .k{font-size:12px;color:var(--text2);font-weight:600}
.tile .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0}
.tile .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.tile .s{font-size:12px;color:var(--muted)}
.big{display:block;background:var(--card2);border-radius:12px;padding:8px 12px;position:relative}
.big span{font-size:12px;color:var(--text2);font-weight:600}
.big input{display:block;width:100%;border:0;background:none;color:var(--text);font:700 30px system-ui;padding:2px 0;outline:none}
.big input::placeholder{color:var(--muted);opacity:.55}
.big em{position:absolute;right:12px;bottom:12px;color:var(--muted);font-style:normal;font-size:13px}
input,select{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=date]{padding:6px 8px;font-size:13px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text2);font-weight:600;flex:1;min-width:0}
button{font:600 14px system-ui;border-radius:12px;border:0;padding:11px 14px;background:var(--card2);color:var(--text)}
button.primary{background:var(--accent);color:#fff;width:100%;margin-top:10px;font-size:16px;padding:14px}
button.sm{padding:6px 10px;font-size:13px;border-radius:9px}
button.ghost{background:none;color:var(--accent);padding:6px 4px}
button.danger{color:var(--bad)}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-left:4px solid var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.alert.bad{border-color:var(--bad)}
.alert b{display:block;font-size:14px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:2px 8px;border-radius:99px;background:var(--card2);white-space:nowrap}
.badge.on,.badge.ahead{color:var(--good)}
.badge.behind{color:var(--bad)}
.badge.nodata,.badge.future{color:var(--muted)}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--text2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.cur td{background:var(--card2)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:6px 10px;font-size:13px;background:none;color:var(--text2);border-radius:8px}
.seg button.on{background:var(--card);color:var(--text)}
.chart{position:relative;margin-top:6px}
.chart svg{display:block;width:100%;touch-action:pan-y;user-select:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text2);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.legend i.dash{border-top-style:dashed}
.legend i.dot{width:6px;height:6px;border:0;border-radius:50%;margin-right:5px}
.tip{position:absolute;pointer-events:none;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px #0004;display:none;white-space:nowrap;z-index:3}
.tip .d{color:var(--muted);margin-bottom:2px}
.tip .r{display:flex;align-items:center;gap:6px}
.tip .r i{width:12px;border-top:2px solid}
.mc{background:var(--card2);border-radius:14px;padding:12px;margin-bottom:10px}
.mc .wt{width:84px}
.reps{display:flex;gap:6px;flex:1;min-width:0}
.reps input{width:100%;text-align:center;padding:9px 2px}
.chip{display:inline-block;margin-top:6px;background:none;border:1px solid var(--good);color:var(--good);font-size:12px;padding:5px 9px;border-radius:99px}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.list .it:last-child{border-bottom:0}
.x{background:none;color:var(--muted);padding:4px 8px;font-size:18px;line-height:1}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:9;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header><h1 id="title">Today</h1><span id="sub"></span></header>
<main id="view"></main>
<nav id="tabs">
  <button data-tab="today"><svg viewBox="0 0 24 24"><path d="M4 12h4l2-5 4 10 2-5h4"/></svg>Today</button>
  <button data-tab="trends"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M7 15l4-4 3 3 5-6"/></svg>Trends</button>
  <button data-tab="gym"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg>Gym</button>
  <button data-tab="check"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12l2 2 4-4"/></svg>Check-ups</button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>More</button>
</nav>
<div id="toast"></div>
<script>
'use strict';
/* ================= constants ================= */
const KEY = 'recomp.v1';
const BASE_WAIST = 106; // waist baseline the milestone table was written against
const MILESTONES = [['2026-12',104.5],['2027-01',103],['2027-02',101.5],['2027-03',100],['2027-04',98.5],['2027-05',97],['2027-06',96],['2027-07',95],['2027-08',94],['2027-09',93],['2027-10',92],['2027-11',91],['2027-12',90]];
const CHECK_TARGETS = [
  {m:'2027-01', bf:[33,34], mu:[32,33], vi:[14,14]},
  {m:'2027-05', bf:[28,30], mu:[34,35], vi:[12,12]},
  {m:'2027-09', bf:[25,26], mu:[35,36], vi:[10,11]},
  {m:'2027-12', bf:[22,22], mu:[36,null], vi:[8,9]},
];
const STRETCH_BF = 18, LONG_WAIST = 87;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const today = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const dn = s => { const [y,m,d] = s.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
const ds = n => { const d = new Date(n*864e5); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); };
const wday = s => WD[new Date(dn(s)*864e5).getUTCDay()];
const monthEnd = ym => { const [y,m] = ym.split('-').map(Number); return Math.round(Date.UTC(y,m,0)/864e5); };
const fmtD = s => { const [,m,d] = s.split('-'); return MON[+m-1]+' '+(+d); };
const fmtYM = ym => { const [y,m] = ym.split('-'); return MON[+m-1]+' '+y; };
const monthsBetween = (a,b) => { const [ay,am]=a.split('-').map(Number), [by,bm]=b.split('-').map(Number); return (by-ay)*12 + bm-am; };
const f1 = v => v==null || isNaN(v) ? '–' : v.toFixed(1);
const f3 = v => v==null || isNaN(v) ? '–' : v.toFixed(3);
const sgn = (v,d=1) => v==null ? '–' : (v>0?'+':v<0?'−':'±') + Math.abs(v).toFixed(d);
const num = s => { if (s==null) return null; s = String(s).trim().replace(',', '.'); if (!s) return null; const v = parseFloat(s); return isNaN(v) ? null : v; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),1800); }

/* ================= state ================= */
function defaults(){
  return {
    v:1,
    settings:{height:174, waistBaseline:106, nextCheckup:'2027-01-15'},
    daily:{},                                    // date -> {w: kg, wa: cm}
    neck:[{date:'2026-11-20', neck:45, waist:106}],
    checkups:[{id:'base', date:'2026-11-20', weight:108.3, bf:35.4, mu:31.6, vi:15, note:'Baseline'}],
    machines:[],                                 // {id,name,unit,group:'U'|'L',inc}
    sessions:[],                                 // {id,date,group,entries:[{mid,w,unit,sets:[reps]}]}
    draft:null,
    meta:{created:today(), lastBackup:null}
  };
}
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v === 1) { const d = defaults(); s.settings = Object.assign(d.settings, s.settings); s.meta = Object.assign(d.meta, s.meta); return s; }
  } catch(e){}
  return defaults();
}
let S = load();
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
if (!localStorage.getItem(KEY)) save();

/* ================= analytics ================= */
function pts(field){
  return Object.keys(S.daily).sort().filter(k => S.daily[k][field]!=null).map(k => ({x:dn(k), date:k, y:S.daily[k][field]}));
}
function avg7(p, end){
  const a = p.filter(q => q.x<=end && q.x>end-7);
  return a.length ? {v:a.reduce((s,q)=>s+q.y,0)/a.length, n:a.length} : null;
}
function avgSeries(p){ return p.map(q => ({x:q.x, date:q.date, y:avg7(p,q.x).v})); }
// least-squares slope over the trailing window, expressed per week
function slope(p, end, win=21){
  const a = p.filter(q => q.x<=end && q.x>end-win);
  if (a.length < 4) return null;
  const mx = a.reduce((s,q)=>s+q.x,0)/a.length, my = a.reduce((s,q)=>s+q.y,0)/a.length;
  let nu=0, de=0; for (const q of a){ nu += (q.x-mx)*(q.y-my); de += (q.x-mx)**2; }
  return de ? nu/de*7 : null;
}
function countDays(p, end, win=7){ return p.filter(q => q.x<=end && q.x>end-win).length; }
function navy(waist, neck, h){
  const d = waist - neck; if (!(d>0) || !(h>0)) return null;
  return 495/(1.0324 - 0.19077*Math.log10(d) + 0.15456*Math.log10(h)) - 450;
}
const msDelta = () => (+S.settings.waistBaseline || BASE_WAIST) - BASE_WAIST;
const statusOf = diff => Math.abs(diff)<=1 ? 'on' : diff<-1 ? 'ahead' : 'behind';
function milestoneRows(){
  const p = pts('wa'), t = dn(today()), d = msDelta(), sl = slope(p, t);
  let curSet = false;
  return MILESTONES.map(([ym,tg]) => {
    const r = {ym, target:+(tg+d).toFixed(1), end:monthEnd(ym)};
    if (r.end < t) {                         // month finished: judge on end-of-month 7-day average
      const a = avg7(p, r.end);
      if (a && a.n>=3){ r.actual=a.v; r.diff=a.v-r.target; r.status=statusOf(r.diff); } else r.status='nodata';
    } else if (!curSet) {                    // next milestone: project current 7-day avg with the 21-day slope
      curSet = true; r.current = true;
      const a = avg7(p, t);
      if (a){ r.actual=a.v; if (sl!=null){ r.proj = a.v + sl/7*(r.end-t); r.diff=r.proj-r.target; r.status=statusOf(r.diff); } else r.status='nodata'; }
      else r.status='nodata';
    } else r.status='future';
    return r;
  });
}
function behindFlag(rows){
  const done = rows.filter(r => r.end < dn(today()));
  if (done.length < 2) return null;
  const [a,b] = done.slice(-2);
  return a.status==='behind' && b.status==='behind' ? [a,b] : null;
}
function navyRows(){
  const h = +S.settings.height;
  return [...S.neck].sort((a,b)=>a.date<b.date?-1:1).map(n => ({...n, bf:navy(n.waist,n.neck,h)}));
}
function targetFor(date){
  const m = date.slice(0,7); let best=null, bd=99;
  for (const t of CHECK_TARGETS){ const dd = Math.abs(monthsBetween(m,t.m)); if (dd<bd){ bd=dd; best=t; } }
  return bd<=1 ? best : null;
}
function evalMetric(kind, v, rng){
  if (v==null || !rng) return null;
  const [lo,hi] = rng;
  if (kind==='mu') return v>=lo ? (hi!=null && v>hi ? 'ahead':'on') : 'behind';
  return v<=hi ? (v<lo ? 'ahead':'on') : 'behind';   // bf, visceral: lower is better
}
const rngTxt = (r, unit='') => r[1]==null ? '≥'+r[0]+unit : r[0]===r[1] ? r[0]+unit : r[0]+'–'+r[1]+unit;
const BADGE = {on:'✓ On track', ahead:'▲ Ahead', behind:'! Behind', nodata:'– No data', future:'Upcoming'};
const badge = s => s ? `<span class="badge ${s}">${BADGE[s]}</span>` : '';

/* gym */
const machine = id => S.machines.find(m => m.id===id);
function sessionsSorted(){ return [...S.sessions].sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0); }
function lastEntry(mid){
  for (const s of sessionsSorted()){ const e = s.entries.find(e => e.mid===mid); if (e) return {date:s.date, e}; }
  return null;
}
function suggestion(m){
  const le = lastEntry(m.id); if (!le) return null;
  const e = le.e;
  if (e.sets.length>=3 && e.sets.every(r => r>=10)) return {from:e.w, lo:e.w+m.inc, hi:e.w+2*m.inc};
  return null;
}
const e1rm = (w,r) => w*(1+r/30);
const setsTxt = e => `${e.w} ${e.unit} × ${e.sets.join('/')}`;

/* ================= chart ================= */
function niceTicks(lo, hi, n=4){
  const span = hi-lo || 1, raw = span/n, mag = 10**Math.floor(Math.log10(raw));
  const step = [1,2,2.5,5,10].map(k=>k*mag).find(s => s>=raw);
  const out = []; for (let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) out.push(+v.toFixed(6));
  return out;
}
/* series: [{name, pts:[{x,y}], kind:'line'|'dots'|'dash', color, fmt}] ; band: [{x,lo,hi}] */
function chart(el, {series, band, xmin, xmax, h=190, unit=''}){
  const W = Math.max(el.clientWidth, 280), H = h, L=38, R=10, T=10, B=22;
  const all = series.flatMap(s => s.pts);
  if (!all.length){ el.innerHTML = '<p class="hint">No data yet.</p>'; return; }
  let x0 = xmin ?? Math.min(...all.map(p=>p.x)), x1 = xmax ?? Math.max(...all.map(p=>p.x));
  if (x1-x0 < 6){ x0 -= 3; x1 += 3; }
  const vis = all.filter(p => p.x>=x0 && p.x<=x1);
  const bandVis = (band||[]).filter(b => b.x>=x0-40 && b.x<=x1+40);
  let ys = vis.map(p=>p.y);
  if (bandVis.length) bandVis.forEach(b => { if (b.x>=x0 && b.x<=x1) ys.push(b.lo,b.hi); });
  if (!ys.length) ys = all.map(p=>p.y);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const padY = Math.max((y1-y0)*0.12, 0.5); y0 -= padY; y1 += padY;
  const sx = x => L + (x-x0)/(x1-x0)*(W-L-R), sy = y => T + (1-(y-y0)/(y1-y0))*(H-T-B);
  const id = 'c'+uid();
  let g = `<defs><clipPath id="${id}"><rect x="${L}" y="${T-4}" width="${W-L-R}" height="${H-T-B+8}"/></clipPath></defs>`;
  for (const t of niceTicks(y0,y1)){ g += `<line x1="${L}" x2="${W-R}" y1="${sy(t)}" y2="${sy(t)}" stroke="var(--line)"/><text x="${L-6}" y="${sy(t)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${+t.toFixed(2)}</text>`; }
  const nx = W<380 ? 3 : 4;
  for (let i=0;i<=nx;i++){ const x = Math.round(x0 + (x1-x0)*i/nx); g += `<text x="${sx(x)}" y="${H-6}" text-anchor="${i===0?'start':i===nx?'end':'middle'}" font-size="10" fill="var(--muted)">${fmtD(ds(x))}</text>`; }
  let body = '';
  if (bandVis.length>1){
    const top = bandVis.map(b=>`${sx(b.x)},${sy(b.hi)}`).join(' '), bot = [...bandVis].reverse().map(b=>`${sx(b.x)},${sy(b.lo)}`).join(' ');
    body += `<polygon points="${top} ${bot}" fill="var(--good)" opacity=".10"/>`;
  }
  for (const s of series){
    const p = s.pts.filter(q => q.x>=x0-40 && q.x<=x1+40);
    if (!p.length) continue;
    if (s.kind==='dots') body += p.map(q=>`<circle cx="${sx(q.x)}" cy="${sy(q.y)}" r="3" fill="${s.color}"/>`).join('');
    else {
      const d = p.map((q,i)=>(i?'L':'M')+sx(q.x).toFixed(1)+','+sy(q.y).toFixed(1)).join('');
      body += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.kind==='dash'?'stroke-dasharray="5 4"':''}/>`;
      if (s.kind==='dash' || s.markers) body += p.map(q=>`<circle cx="${sx(q.x)}" cy="${sy(q.y)}" r="4" fill="var(--card)" stroke="${s.color}" stroke-width="2"/>`).join('');
    }
  }
  const legend = series.length>1 ? `<div class="legend">${series.map(s=>`<span><i class="${s.kind==='dots'?'dot':s.kind==='dash'?'dash':''}" style="${s.kind==='dots'?'background':'border-color'}:${s.color}"></i>${esc(s.name)}</span>`).join('')}${bandVis.length?'<span><i class="dot" style="background:var(--good);opacity:.4;width:12px;border-radius:2px"></i>±1 cm</span>':''}</div>` : '';
  el.innerHTML = legend + `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}<g clip-path="url(#${id})">${body}</g><line class="xh" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" style="display:none"/><g class="hl"></g><rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = el.querySelector('.xh'), hl = el.querySelector('.hl');
  const xsU = [...new Set(series.flatMap(s=>s.pts.map(p=>p.x)))].filter(x=>x>=x0&&x<=x1).sort((a,b)=>a-b);
  function move(ev){
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const xv = x0 + (px-L)/(W-L-R)*(x1-x0);
    if (!xsU.length) return;
    let best = xsU[0]; for (const x of xsU) if (Math.abs(x-xv) < Math.abs(best-xv)) best = x;
    xh.setAttribute('x1', sx(best)); xh.setAttribute('x2', sx(best)); xh.style.display='';
    tip.textContent=''; hl.innerHTML='';
    const hd = document.createElement('div'); hd.className='d'; hd.textContent = wday(ds(best))+' '+fmtD(ds(best)); tip.appendChild(hd);
    for (const s of series){
      const q = s.pts.find(p=>p.x===best); if (!q) continue;
      hl.innerHTML += `<circle cx="${sx(q.x)}" cy="${sy(q.y)}" r="5" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`;
      const row = document.createElement('div'); row.className='r';
      const i = document.createElement('i'); i.style.borderColor = s.color; row.appendChild(i);
      const b = document.createElement('b'); b.textContent = (s.fmt||f1)(q.y) + unit; row.appendChild(b);
      const sp = document.createElement('span'); sp.className='muted'; sp.textContent = s.name; row.appendChild(sp);
      tip.appendChild(row);
    }
    tip.style.display='block';
    const cx = sx(best) * r.width / W, tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(cx - tw/2, 0), r.width - tw) + 'px';
    tip.style.top = (legend ? 20 : 0) - tip.offsetHeight - 4 + 'px';
  }
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', ev => { if (ev.pointerType==='mouse'){ tip.style.display='none'; xh.style.display='none'; hl.innerHTML=''; } });
}

function saveLog(){
  const d = $('#ld').value || today(), w = num($('#lw').value), wa = num($('#lwa').value);
  if (w==null && wa==null) return toast('Enter weight and/or waist');
  if (w!=null && (w<40 || w>250)) return toast('Weight looks off (kg)');
  if (wa!=null && (wa<50 || wa>200)) return toast('Waist looks off (cm)');
  const aW = avg7(pts('w'), dn(d)), aA = avg7(pts('wa'), dn(d));
  const warn = [];
  if (w!=null && aW && Math.abs(w-aW.v)>3) warn.push(`weight ${w} vs 7-day ${f1(aW.v)}`);
  if (wa!=null && aA && Math.abs(wa-aA.v)>4) warn.push(`waist ${wa} vs 7-day ${f1(aA.v)}`);
  if (warn.length && !confirm('Big jump: '+warn.join(', ')+'. Save anyway?')) return;
  const e = S.daily[d] || {};
  if (w!=null) e.w = w; if (wa!=null) e.wa = wa;
  S.daily[d] = e; save();
  navigator.storage?.persist?.();
  const a = avg7(pts('wa'), dn(today()));
  toast('Saved' + (a ? ` · waist 7-day ${f1(a.v)} cm` : ''));
  render();
}

    S.machines.push({id:uid(), name, unit, group:$('#mg').value, inc}); save(); toast('Added '+name); render();
  };
  document.querySelectorAll('[data-om]').forEach(b => b.onclick = () => { openMachine = openMachine===b.dataset.om ? null : b.dataset.om; render(); });
  document.querySelectorAll('[data-em]').forEach(b => b.onclick = () => {
    const m = machine(b.dataset.em); const n = prompt('Name', m.name); if (n==null) return;
    const inc = num(prompt('Step ('+m.unit+')', m.inc)); m.name = n.trim()||m.name; if (inc) m.inc = inc;
    const g = prompt('Day: U = Upper, L = Lower', m.group); if (g && /^[UL]$/i.test(g.trim())) m.group = g.trim().toUpperCase();
    save(); render();
  });
  document.querySelectorAll('[data-tu]').forEach(b => b.onclick = () => { const m = machine(b.dataset.tu); m.unit = m.unit==='lb'?'kg':'lb'; save(); toast('New sets will be in '+m.unit+' (old sets keep their unit)'); render(); });
  document.querySelectorAll('[data-xm]').forEach(b => b.onclick = () => { const m = machine(b.dataset.xm); if (confirm('Delete '+m.name+'? Its logged sets stay in session history.')){ S.machines = S.machines.filter(x=>x!==m); openMachine=null; save(); render(); } });
  document.querySelectorAll('[data-xs]').forEach(b => b.onclick = () => { if (confirm('Delete this session?')){ S.sessions = S.sessions.filter(s=>s.id!==b.dataset.xs); save(); render(); } });
  if (openMachine && $('#chM')){
    const m = machine(openMachine), C = COLORS();
    const hist = [...S.sessions].sort((a,b)=>a.date<b.date?-1:1).flatMap(s => s.entries.filter(e=>e.mid===m.id && e.unit===m.unit).map(e => ({x:dn(s.date), w:e.w, best:Math.max(...e.sets.map(r=>e1rm(e.w,r)))})));
    chart($('#chM'), {series:[
      {name:'Working weight', pts:hist.map(h=>({x:h.x,y:h.w})), kind:'line', markers:true, color:C.acc},
      {name:'Est. 1RM (Epley)', pts:hist.map(h=>({x:h.x,y:h.best})), kind:'line', color:C.s2}], unit:' '+m.unit, h:170});
  }
}

function vCheck(){
  const cs = [...S.checkups].sort((a,b)=>a.date<b.date?-1:1);
  const cell = (kind, v, t, unit) => { const st = t ? evalMetric(kind, v, t[kind]) : null; return `<td class="n">${v==null?'–':v+unit}${st?` <span class="badge ${st}" title="${BADGE[st]}">${BADGE[st].split(' ')[0]}</span>`:''}</td>`; };
  return `
  <section class="card"><h2>Targets</h2>
    <table><tr><th>Check-up</th><th class="n">Body fat</th><th class="n">Muscle</th><th class="n">Visceral</th></tr>
    ${CHECK_TARGETS.map(t=>`<tr><td>${fmtYM(t.m)}</td><td class="n">${rngTxt(t.bf,'%')}</td><td class="n">${rngTxt(t.mu,'%')}</td><td class="n">${rngTxt(t.vi)}</td></tr>`).join('')}
    </table><p class="hint">Stretch goal: ${STRETCH_BF}% body fat.</p></section>
  <section class="card"><h2>Body fat & muscle (clinic)</h2><div class="chart" id="chBF"></div><div class="chart" id="chMU" style="margin-top:12px"></div></section>
  <section class="card"><h2>Results</h2>
    <div style="overflow-x:auto"><table><tr><th>Date</th><th class="n">Weight</th><th class="n">BF</th><th class="n">Muscle</th><th class="n">Visc.</th><th></th></tr>
    ${cs.map((c,i)=>{ const t = targetFor(c.date), p = cs[i-1];
      return `<tr><td>${fmtD(c.date)} ${c.date.slice(2,4)}${t?'':'<br><span class="hint">'+(esc(c.note||'')||'no target')+'</span>'}</td><td class="n">${c.weight??'–'}${p&&c.weight!=null&&p.weight!=null?'<br><span class="hint">'+sgn(c.weight-p.weight)+'</span>':''}</td>${cell('bf',c.bf,t,'%')}${cell('mu',c.mu,t,'%')}${cell('vi',c.vi,t,'')}<td><button class="x" data-xc="${c.id}">×</button></td></tr>`; }).join('')}
    </table></div><p class="hint">✓ within target range · ▲ ahead of it · ! behind, vs the nearest planned check-up.</p></section>
  <section class="card"><h2>Add check-up</h2>
    <div class="row wrap">
      <label class="f" style="flex:1 1 140px">Date<input type="date" id="cd" value="${today()}"></label>
      <label class="f" style="flex:1 1 80px">Weight kg<input id="cw" inputmode="decimal"></label>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="f">Body fat %<input id="cb" inputmode="decimal"></label>
      <label class="f">Muscle %<input id="cm" inputmode="decimal"></label>
      <label class="f">Visceral<input id="cv" inputmode="decimal"></label>
    </div>
    <button class="sm" id="cadd" style="margin-top:10px">Add check-up</button>
  </section>`;
}
function bindCheck(){
  const C = COLORS(), cs = [...S.checkups].sort((a,b)=>a.date<b.date?-1:1);
  const tp = (k, pick) => CHECK_TARGETS.map(t => ({x:monthEnd(t.m)-14, y:pick(t[k])}));
  chart($('#chBF'), {series:[
    {name:'Body fat', pts:cs.filter(c=>c.bf!=null).map(c=>({x:dn(c.date),y:c.bf})), kind:'line', markers:true, color:C.acc},
    {name:'Target (upper)', pts:tp('bf', r=>r[1]), kind:'dash', color:C.muted}], unit:'%', h:160});
  chart($('#chMU'), {series:[
    {name:'Muscle', pts:cs.filter(c=>c.mu!=null).map(c=>({x:dn(c.date),y:c.mu})), kind:'line', markers:true, color:C.s2},
    {name:'Target (lower)', pts:tp('mu', r=>r[0]), kind:'dash', color:C.muted}], unit:'%', h:160});
  document.querySelectorAll('[data-xc]').forEach(b => b.onclick = () => { if (confirm('Delete this check-up?')){ S.checkups = S.checkups.filter(c=>c.id!==b.dataset.xc); save(); render(); } });
  $('#cadd').onclick = () => {
    const c = {id:uid(), date:$('#cd').value, weight:num($('#cw').value), bf:num($('#cb').value), mu:num($('#cm').value), vi:num($('#cv').value)};
    if (!c.date || c.bf==null) return toast('Date and body fat needed');
    S.checkups.push(c); save(); toast('Check-up saved'); render();
  };
}

function vMore(){
  const pA = pts('wa'), first = pA.length ? pA.filter(q => q.x < pA[0].x+7) : [];
  const firstAvg = first.length>=3 ? first.reduce((s,q)=>s+q.y,0)/first.length : null;
  return `
  <section class="card"><h2>Settings</h2>
    <div class="row wrap">
      <label class="f">Height cm<input id="sh" inputmode="decimal" value="${S.settings.height}"></label>
      <label class="f">Waist baseline cm<input id="sb" inputmode="decimal" value="${S.settings.waistBaseline}"></label>
      <label class="f" style="flex:1 1 140px">Next check-up<input type="date" id="sn" value="${S.settings.nextCheckup||''}"></label>
    </div>
    <p class="hint">Changing the waist baseline shifts every monthly milestone by the same delta (plan written for 106 cm; current shift ${sgn(msDelta())} cm).${firstAvg?` Your first week of logs averages <b>${f1(firstAvg)} cm</b>.`:''}</p>
    <button class="sm" id="ssave" style="margin-top:8px">Save settings</button>
  </section>
  <section class="card"><h2>Backup</h2>
    <p class="hint" style="margin-top:0">Data lives only on this phone. Export weekly (e.g. share to Google Drive). Last backup: <b>${S.meta.lastBackup||'never'}</b>. Storage persistence: <b id="pst">…</b></p>
    <div class="row wrap" style="margin-top:10px">
      <button class="sm" id="bx">Export backup (JSON)</button>
      <button class="sm" id="bc">Export CSV</button>
      <button class="sm" id="bi">Import backup</button>
      <input type="file" id="bf" accept="application/json,.json" hidden>
    </div>
  </section>
  <section class="card"><h2>About the numbers</h2>
    <p class="hint" style="margin-top:0">7-day average = mean of entries in the trailing 7 calendar days. Trend = least-squares slope of the last 21 days of raw entries, shown per week. Navy BF% = 495 / (1.0324 − 0.19077·log10(waist − neck) + 0.15456·log10(height)) − 450.</p>
    <p class="hint">${Object.keys(S.daily).length} daily entries · ${S.neck.length} neck · ${S.sessions.length} sessions · ${S.checkups.length} check-ups</p>
    <button class="sm danger" id="reset" style="margin-top:8px">Erase all data</button>
  </section>`;
}
function bindMore(){
  navigator.storage?.persisted?.().then(p => { $('#pst').textContent = p ? 'on' : 'not granted yet'; }).catch(()=>{ $('#pst').textContent='unknown'; });
  if (!navigator.storage?.persisted) $('#pst').textContent='unsupported';
  $('#ssave').onclick = () => {
    const h = num($('#sh').value), b = num($('#sb').value);
    if (!(h>100 && h<230) || !(b>50 && b<200)) return toast('Check the values');
    S.settings.height = h; S.settings.waistBaseline = b; S.settings.nextCheckup = $('#sn').value; save(); toast('Settings saved'); render();
  };
  $('#bx').onclick = exportJSON;
  $('#bc').onclick = () => {
    const rows = ['date,weight_kg,waist_cm', ...Object.keys(S.daily).sort().map(k=>`${k},${S.daily[k].w??''},${S.daily[k].wa??''}`)];
    const sets = ['date,group,machine,unit,weight,reps'];
    for (const s of S.sessions) for (const e of s.entries){ const m = machine(e.mid); sets.push(`${s.date},${s.group},"${(m?m.name:e.mid).replace(/"/g,'""')}",${e.unit},${e.w},${e.sets.join('/')}`); }
    download('recomp-daily-'+today()+'.csv', rows.join('\n'), 'text/csv');
    setTimeout(()=>download('recomp-sets-'+today()+'.csv', sets.join('\n'), 'text/csv'), 400);
  };
  $('#bi').onclick = () => $('#bf').click();
  $('#bf').onchange = async () => {
    const f = $('#bf').files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (d.v!==1 || typeof d.daily!=='object') throw 0;
      if (!confirm(`Replace all data with this backup (${Object.keys(d.daily).length} daily entries, ${(d.sessions||[]).length} sessions)?`)) return;
      S = Object.assign(defaults(), d); save(); toast('Backup restored'); render();
    } catch(e){ toast('Not a valid backup file'); }
  };
  $('#reset').onclick = () => { if (confirm('Erase ALL data on this phone?') && confirm('Really? Export a backup first if unsure.')){ localStorage.removeItem(KEY); S = load(); save(); render(); } };
}
function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function exportJSON(){
  const name = 'recomp-backup-'+today()+'.json';
  S.meta.lastBackup = today(); save();
  const text = JSON.stringify(S);
  try {
    const file = new File([text], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); toast('Backup shared'); render(); return; }
  } catch(e){ if (e && e.name==='AbortError'){ return; } }
  download(name, text, 'application/json'); toast('Backup downloaded'); render();
}

/* ================= shell ================= */
const VIEWS = {
  today:{t:'Today', v:vToday, b:bindToday},
  trends:{t:'Trends', v:vTrends, b:bindTrends},
  gym:{t:'Gym', v:vGym, b:bindGym},
  check:{t:'Check-ups', v:vCheck, b:bindCheck},
  more:{t:'More', v:vMore, b:bindMore},
};
function render(){
  const V = VIEWS[tab];
  $('#title').textContent = V.t;
  $('#sub').textContent = wday(today())+' '+fmtD(today());
  $('#view').innerHTML = V.v();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab===tab));
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { const [t,h] = b.dataset.go.split('#'); tab=t; render(); if (h) setTimeout(()=>document.getElementById(h)?.scrollIntoView({behavior:'smooth'}),50); });
  V.b();
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; window.scrollTo(0,0); render(); });
let rw; addEventListener('resize', () => { clearTimeout(rw); rw = setTimeout(() => { if (tab==='trends'||tab==='check'||(tab==='gym'&&openMachine)) render(); }, 200); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && tab==='today' && !document.activeElement?.matches('input')) render(); });
if (S.draft) tab = 'gym';
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
